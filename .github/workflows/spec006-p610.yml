name: SPEC006 P610

on:
  push:
    branches:
      - spec006-premium-product-foundation
    paths:
      - ".github/workflows/spec006-p610.yml"
      - "composer.json"
      - "phpunit.xml.dist"
      - "phpcs.xml.dist"
      - "phpstan.neon.dist"
      - "tests/phpunit/**"
      - "tests/unit/spec006-p600-metadata-license.php"
      - "specs/006-premium-product-foundation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - name: Composer validate
        run: composer validate --strict
      - name: Install development tooling
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: composer test:phpunit
      - name: WPCS bounded baseline
        run: composer lint:wpcs
      - name: PHPStan bounded baseline
        run: composer analyse
      - name: Audit full-plugin WPCS debt
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs plugin/base-conhecimento-inteligencia-integrada --report=summary
          code=$?
          echo "FULL_PLUGIN_PHPCS_EXIT=$code"
          exit 0
