name: PX750 isolation PHP lint

on:
  push:
    branches:
      - diagnostic/px750-isolation-php-lint-20261006
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none
          coverage: none
      - name: Lint all plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find plugin/base-conhecimento-inteligencia-integrada -type f -name '*.php' -print0 | xargs -0 -n1 php -l
