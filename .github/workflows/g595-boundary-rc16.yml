name: G595 Boundary RC16

on:
  push:
    branches:
      - spec005-g595-boundary-review
    paths:
      - ".github/workflows/g595-boundary-rc16.yml"
      - "tools/homologation/spec005/build-g595.py"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
      - "tests/unit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate G595 RC16
        run: python3 tools/homologation/spec005/build-g595.py
      - name: Upload boundary artifact
        uses: actions/upload-artifact@v4
        with:
          name: g595-rc16-boundary
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.16-g595.1.zip
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.16-g595.1.manifest.json
            dist/g595-local-package-validation.json
