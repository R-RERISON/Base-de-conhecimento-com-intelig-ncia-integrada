name: SPEC006 P620 Plugin Check

on:
  push:
    branches:
      - spec006-premium-product-foundation
    paths:
      - ".github/workflows/spec006-p620.yml"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
      - "specs/006-premium-product-foundation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './plugin/base-conhecimento-inteligencia-integrada'
          wp-version: 'latest'
          include-experimental: 'false'
          strict: 'false'
          slug: 'bdc-knowledge-base'
