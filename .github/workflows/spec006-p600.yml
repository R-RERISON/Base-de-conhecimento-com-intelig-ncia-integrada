name: SPEC006 P600

on:
  push:
    branches:
      - spec006-premium-product-foundation
    paths:
      - ".github/workflows/spec006-p600.yml"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
      - "tests/unit/spec006-p600-metadata-license.php"
      - "specs/006-premium-product-foundation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate P600 metadata/license
        run: php tests/unit/spec006-p600-metadata-license.php
      - name: Lint plugin PHP
        run: |
          find plugin/base-conhecimento-inteligencia-integrada -name '*.php' -print0 | xargs -0 -n1 php -l
