name: G585 RC14 Diagnostic Package

on:
  push:
    branches:
      - spec005-g585-decommission-readiness-v2
    paths:
      - ".github/workflows/g585-rc14-diagnostic.yml"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
      - "tests/unit/spec005-g585-decommission-readiness-v2.php"
      - "tools/homologation/spec005/build-g585.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate G585 RC14
        run: |
          python3 tools/homologation/spec005/build-g585.py
      - name: Upload homologation artifact
        uses: actions/upload-artifact@v4
        with:
          name: g585-rc14-diagnostic
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.14-g585.4.zip
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.14-g585.4.manifest.json
            dist/g585-v2-local-package-validation.json
