name: SPEC006 P630 Package

on:
  push:
    branches:
      - spec006-premium-product-foundation
    paths:
      - ".github/workflows/spec006-p630-package.yml"
      - "tools/homologation/spec006/build-p630.py"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Build deterministic P630 homologation package
        run: python3 tools/homologation/spec006/build-p630.py

      - name: Upload P630 artifact
        uses: actions/upload-artifact@v4
        with:
          name: spec006-p630-homologation
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/base-conhecimento-inteligencia-integrada-0.6.0-dev-p630.1.zip
            dist/base-conhecimento-inteligencia-integrada-0.6.0-dev-p630.1.manifest.json
            dist/p630-local-package-validation.json
