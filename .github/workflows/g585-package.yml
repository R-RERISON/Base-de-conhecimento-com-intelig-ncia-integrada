name: G585 Homologation Package

on:
  push:
    branches:
      - spec005-g585-decommission-readiness-v2
    paths:
      - ".github/workflows/g585-package.yml"
      - "tools/homologation/spec005/build-g585.py"
      - "tools/t100e/**"
      - "plugin/base-conhecimento-inteligencia-integrada/**"
      - "tests/unit/spec005-g585-decommission-readiness-v2.php"
      - "tests/unit/spec005-search-engine.php"
      - "tests/unit/spec005-golden-gate.php"
      - "tests/unit/spec005-runtime-resources.php"
      - "tests/unit/spec005-section-retrieval-g590.php"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment
        run: |
          php -v
          python3 --version
          git rev-parse HEAD

      - name: Build deterministic G-585 package
        run: |
          python3 tools/homologation/spec005/build-g585.py

      - name: Show evidence summary
        run: |
          cat dist/g585-v2-local-package-validation.json
          sha256sum dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.13-g585.3.zip

      - name: Upload homologation package
        uses: actions/upload-artifact@v4
        with:
          name: g585-v2-homologation
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.13-g585.3.zip
            dist/base-conhecimento-inteligencia-integrada-0.5.1-rc.13-g585.3.manifest.json
            dist/g585-v2-local-package-validation.json
